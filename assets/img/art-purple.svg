    <rect x="70" y="80" width="34" height="240" rx="4"/><rect x="112" y="140" width="34" height="180" rx="4"/><rect x="154" y="190" width="34" height="130" rx="4"/>
  </g>
  <g fill="#255B52"><rect x="196" y="230" width="34" height="90" rx="4"/><rect x="238" y="256" width="34" height="64" rx="4"/><rect x="280" y="274" width="34" height="46" rx="4"/><rect x="322" y="287" width="34" height="33" rx="4"/></g>
